<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Capability routing topology</title>
  <desc id="desc">A functional patch-bay field showing worker, model, skill, and MCP sockets routed through junctions to tools, providers, CLI, and reports. No human operator is depicted.</desc>
  <rect width="1200" height="760" fill="#070605"/>

  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M34 60h46M34 60v46M1166 60h-46M1166 60v46M34 700h46M34 700v-46M1166 700h-46M1166 700v-46" stroke="#A7A39B" stroke-width="1"/>
    <path d="M74 120H1126M74 640H1126" stroke="#1A1714" stroke-width="1"/>
    <path d="M100 148V612M1100 148V612" stroke="#1A1714" stroke-width="1"/>

    <!-- incoming sockets -->
    <g stroke="#A7A39B" stroke-width="1">
      <circle cx="132" cy="205" r="18"/><circle cx="132" cy="315" r="18"/><circle cx="132" cy="425" r="18"/><circle cx="132" cy="535" r="18"/>
      <path d="M132 187v-16M132 333v-16M132 407v-16M132 553v16"/>
    </g>
    <g fill="#F2F1EC" font-family="'IBM Plex Mono',monospace" font-size="13" letter-spacing="2">
      <text x="84" y="162">WORKERS</text><text x="84" y="272">MODELS</text><text x="84" y="382">SKILLS</text><text x="84" y="492">MCP</text>
    </g>

    <!-- outgoing sockets -->
    <g stroke="#A7A39B" stroke-width="1">
      <circle cx="1068" cy="205" r="18"/><circle cx="1068" cy="315" r="18"/><circle cx="1068" cy="425" r="18"/><circle cx="1068" cy="535" r="18"/>
      <path d="M1068 187v-16M1068 333v-16M1068 407v-16M1068 553v16"/>
    </g>
    <g fill="#F2F1EC" font-family="'IBM Plex Mono',monospace" font-size="13" letter-spacing="2" text-anchor="end">
      <text x="1116" y="162">TOOLS</text><text x="1116" y="272">PROVIDERS</text><text x="1116" y="382">CLI</text><text x="1116" y="492">REPORTS</text>
    </g>

    <!-- patch-bay rails -->
    <g stroke="#A7A39B" stroke-width="1">
      <rect x="250" y="164" width="130" height="410"/>
      <rect x="450" y="164" width="130" height="410"/>
      <rect x="650" y="164" width="130" height="410"/>
      <rect x="850" y="164" width="100" height="410"/>
    </g>
    <g stroke="#1A1714" stroke-width="1">
      <path d="M250 246h130M250 328h130M250 410h130M250 492h130M450 246h130M450 328h130M450 410h130M450 492h130M650 246h130M650 328h130M650 410h130M650 492h130M850 246h100M850 328h100M850 410h100M850 492h100"/>
    </g>
    <g fill="#A7A39B" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1">
      <text x="270" y="190">INTAKE</text><text x="470" y="190">ROUTER</text><text x="670" y="190">POLICY</text><text x="868" y="190">EGRESS</text>
    </g>

    <!-- passive routes -->
    <g stroke="#A7A39B" stroke-width="1" opacity=".78">
      <path d="M150 205H250V205H450V315H650V205H850V205H1050"/>
      <path d="M150 315H250V425H450V315H650V425H850V315H1050" stroke-dasharray="5 7"/>
      <path d="M150 425H250V315H450V535H650V315H850V425H1050"/>
      <path d="M150 535H250V535H450V425H650V535H850V535H1050" stroke-dasharray="2 7"/>
    </g>

    <!-- active path -->
    <g fill="none" stroke="#FF3B12" stroke-width="2">
      <path d="M150 205H250V315H450V425H650V315H850V425H1050"/>
      <path d="M384 315h42M584 425h42M784 315h42"/>
    </g>
    <g fill="#FF3B12" stroke="#070605" stroke-width="3">
      <circle cx="250" cy="205" r="5"/><circle cx="450" cy="315" r="5"/><circle cx="650" cy="425" r="5"/><circle cx="850" cy="425" r="5"/><circle cx="1050" cy="425" r="5"/>
    </g>

    <!-- junction sockets -->
    <g fill="#070605" stroke="#F2F1EC" stroke-width="1">
      <circle cx="250" cy="205" r="8"/><circle cx="250" cy="315" r="8"/><circle cx="250" cy="425" r="8"/><circle cx="250" cy="535" r="8"/>
      <circle cx="450" cy="205" r="8"/><circle cx="450" cy="315" r="8"/><circle cx="450" cy="425" r="8"/><circle cx="450" cy="535" r="8"/>
      <circle cx="650" cy="205" r="8"/><circle cx="650" cy="315" r="8"/><circle cx="650" cy="425" r="8"/><circle cx="650" cy="535" r="8"/>
      <circle cx="850" cy="205" r="8"/><circle cx="850" cy="315" r="8"/><circle cx="850" cy="425" r="8"/><circle cx="850" cy="535" r="8"/>
    </g>
    <g fill="#F2F1EC" font-family="'IBM Plex Mono',monospace" font-size="10" text-anchor="middle">
      <text x="250" y="603">4/4</text><text x="450" y="603">3/4</text><text x="650" y="603">4/4</text><text x="850" y="603">2/4</text>
    </g>
  </g>

  <g fill="#A7A39B" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1">
    <text x="86" y="92">CAPABILITY PATCH-BAY / ROUTE FIELD</text>
    <text x="886" y="92">ACTIVE 01 / CAPACITY 13</text>
    <text x="88" y="676">SOCKETS 16</text><text x="452" y="676">JUNCTIONS 12</text><text x="874" y="676">STATE / NOMINAL</text>
  </g>
</svg>
